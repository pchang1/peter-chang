server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Disable Nginx version disclosure
    server_tokens off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; frame-ancestors 'none';" always;

    # gzip text assets
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript image/svg+xml application/json;

    # long cache for static media, revalidate HTML
    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location ~* \.(html)$ {
        add_header Cache-Control "no-cache";
    }

    # force the resume to download with a clean filename
    location = /Peter_Chang_Resume.pdf {
        add_header Content-Disposition 'attachment; filename="Peter_Chang_Resume.pdf"';
    }

    # Map AppIcon.png and Apple touch icons to via-icon.png to support WebClips/shortcuts
    location ~* /(AppIcon|apple-touch-icon|apple-touch-icon-precomposed)\.png$ {
        try_files /via-icon.png =404;
    }

    # Map favicon.ico to via-icon.png
    location = /favicon.ico {
        try_files /via-icon.png =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
